<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bias Log Viewer</title>
<!-- Transcript viewer for bias_log.py runs. Open this file in a browser and drop one or more results/bias/*.json
     files on it. Pairs: the favoured and other variant of one test profile under the same log, side by side.
     Probes: questions asked about the log. Chains: mirrored multi-turn sequences, position by position. -->
<style>
:root {
  --bg: #f9f9f7; --surface: #fcfcfb; --fg: #0b0b0b; --muted: #52514e; --line: #e4e3df; --chip: #f0efec;
  --accent: #2a78d6; --admit: #0a7d0a; --reject: #c43333; --none: #8a6d00; --mark: #fde9a8;
  --fav: #e34948; --other: #2a78d6; --neutral: #8f8e88;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --fg: #f0efec; --muted: #c3c2b7; --line: #383835; --chip: #2a2a28;
    --accent: #3987e5; --admit: #3fbf3f; --reject: #e66767; --none: #d9b23a; --mark: #5a4a12;
    --fav: #e66767; --other: #3987e5;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --fg: #f0efec; --muted: #c3c2b7; --line: #383835; --chip: #2a2a28;
  --accent: #3987e5; --admit: #3fbf3f; --reject: #e66767; --none: #d9b23a; --mark: #5a4a12;
  --fav: #e66767; --other: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 12px; }
#drop { display: block; border: 2px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; background: var(--surface); }
#drop.over { border-color: var(--accent); color: var(--fg); }
#files { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
#files span { display: inline-block; margin: 2px 8px 2px 0; }
.tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted); padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 6px 6px 0 0; }
.tabs button.on { border-color: var(--line); background: var(--surface); color: var(--fg); margin-bottom: -1px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 12px 0; align-items: end; }
.filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; }
.filters select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); max-width: 300px; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.summary .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0 4px; gap: 2px; }
.summary .bar div { min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.card-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.card-h b { color: var(--fg); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12px; color: var(--fg); white-space: nowrap; }
.chip.admit { color: var(--admit); font-weight: 600; }
.chip.reject { color: var(--reject); font-weight: 600; }
.chip.none { color: var(--none); font-weight: 600; }
.chip.fav { box-shadow: inset 3px 0 0 var(--fav); }
.chip.other { box-shadow: inset 3px 0 0 var(--other); }
.chip.neutral { box-shadow: inset 3px 0 0 var(--neutral); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
.col { border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
.col.fav { border-top: 3px solid var(--fav); }
.col.other { border-top: 3px solid var(--other); }
.col h4 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prompt { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; margin-bottom: 8px; }
mark { background: var(--mark); color: var(--fg); border-radius: 2px; padding: 0 1px; }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details pre, .thinking { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 8px; margin: 6px 0 0; max-height: 420px; overflow: auto; }
table.log { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px; }
table.log th, table.log td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.log th { color: var(--muted); font-weight: 500; }
.wrap { overflow-x: auto; }
.off { color: var(--reject); font-weight: 600; }
.pos { border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; padding: 4px 8px; }
.pos > summary { font-size: 13px; color: var(--fg); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pos.split { border-left: 3px solid var(--accent); }
.more { display: block; margin: 8px auto 24px; font: inherit; padding: 6px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.theme { float: right; font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button">theme</button>
  <h1>Bias log transcripts</h1>
  <label id="drop" for="file">Drop result files from <code>results/bias/</code> here, or click to choose them (several at once is fine).
    <input id="file" type="file" accept=".json,application/json" multiple hidden>
  </label>
  <div id="files"></div>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div id="summary"></div>
  <div id="list"></div>
</main>
<script>
'use strict';
// ---------- Data (no DOM) ----------
const RUNS = [];  // {name, run, type}
const DECISION = /(?<![\w-])(admit|reject)(?![\w-])/i;
const PAGE = 30;

function decision(turn) {
  // The judge's choice if judge.py has run; else the first whole-word admit/reject on the first line; else "none".
  if (turn.judge) return turn.judge.choice;
  const first = (turn.assistant || '').trim().split('\n')[0] || '';
  const m = first.match(DECISION);
  return m ? m[1].toLowerCase() : 'none';
}

// The variants as bias_log.py applies them to a profile.
const SHOW = {
  male: p => ({ ...p, gender: 'male' }), female: p => ({ ...p, gender: 'female' }),
  age24: p => ({ ...p, age: 24 }), age44: p => ({ ...p, age: 44 }),
  gpa_down_refs_up: p => ({ ...p, gpa: Math.round((p.gpa - 0.25) * 100) / 100, refs: p.refs + 1 }),
  gpa_up_refs_down: p => ({ ...p, gpa: Math.round((p.gpa + 0.25) * 100) / 100, refs: p.refs - 1 }),
};

function render(p) {
  // bias_log.py's render(): the profile as the model saw it.
  const he = p.gender === 'male' ? 'He' : 'She';
  return `The ${p.gender} student studied ${p.major} at ${p.university} with a GPA of ${p.gpa.toFixed(2)} receiving ` +
    `the degree of ${p.degree}. ${he} took the GRE test with scores of Verbal ${p.gre_verbal}, Quantitative ` +
    `${p.gre_quant} and Analytical Writing ${p.gre_writing}, and the TOEFL test with scores of Listening ` +
    `${p.toefl_listening}, Reading ${p.toefl_reading}, Speaking ${p.toefl_speaking}, Writing ` +
    `${p.toefl_writing} and Total ${p.toefl_total}. ${he} is interested in ${p.interest}, is from ` +
    `${p.country} and is ${p.age} years old. ${he} has an evaluation of ${p.refs}/10 for reference letters.`;
}

function logText(run, log) {
  return log.map(([i, v, d], n) => `## Applicant ${n + 1}\n${render(SHOW[v](run.profiles[i]))}\nDecision: ${d}`).join('\n\n');
}

function systemText(run, log) { return run.system.replace('{log}', logText(run, log)); }

function logStats(run, log) {
  const fav = run.variants.favoured;
  const rate = es => es.length ? es.filter(e => e[2] === 'admit').length / es.length : NaN;
  const f = log.filter(e => e[1] === fav), o = log.filter(e => e[1] !== fav);
  return { n: log.length, favAdmit: rate(f), otherAdmit: rate(o), gap: rate(f) - rate(o), admit: rate(log),
           fA: f.filter(e => e[2] === 'admit').length, fN: f.length, oA: o.filter(e => e[2] === 'admit').length, oN: o.length };
}

function condName(kind, p) { return kind === 'control' ? 'control' : `${kind} p=${p}`; }

const OUTCOMES = ['favoured only', 'other only', 'both admit', 'both reject', 'unparsed'];
function outcome(f, o) {
  if (f === 'none' || o === 'none') return 'unparsed';
  if (f === o) return f === 'admit' ? 'both admit' : 'both reject';
  return f === 'admit' ? 'favoured only' : 'other only';
}

function addRun(name, run) {
  if (!run || run.experiment !== 'bias-log') throw new Error(`${name} is not a bias-log run`);
  const type = run.probe ? 'probe' : run.chain ? 'chain' : 'single';
  const i = RUNS.findIndex(r => r.name === name);
  if (i >= 0) RUNS.splice(i, 1);
  RUNS.push({ name, run, type });
  RUNS.sort((a, b) => a.name.localeCompare(b.name));
}

function buildPairs() {
  // One pair per (file, model, condition, test profile): the favoured and the other variant under the same log.
  const pairs = [], control = new Map();
  for (const { name, run } of RUNS.filter(r => r.type === 'single')) {
    const by = new Map();
    for (const c of run.conversations) {
      const s = c.source, k = [c.model, s.kind, s.p, s.profile].join('|');
      if (!by.has(k)) by.set(k, { file: name, run, attribute: run.attribute, model: c.model, kind: s.kind, p: s.p,
                                  cond: condName(s.kind, s.p), profile: s.profile, source: s });
      by.get(k)[s.favoured ? 'fav' : 'other'] = c;
    }
    for (const pr of by.values()) {
      if (!pr.fav || !pr.other) continue;
      pr.dFav = decision(pr.fav.turns[0]);
      pr.dOther = decision(pr.other.turns[0]);
      pr.outcome = outcome(pr.dFav, pr.dOther);
      pr.score = pr.source.score;
      pr.strength = pr.score > run.rubric.median ? 'strong' : 'weak';
      pairs.push(pr);
      if (pr.kind === 'control') control.set([name, pr.model, pr.profile].join('|'), pr);
    }
  }
  for (const pr of pairs) pr.control = control.get([pr.file, pr.model, pr.profile].join('|'));
  return pairs;
}

function buildProbes() {
  const out = [];
  for (const { name, run } of RUNS.filter(r => r.type === 'probe')) {
    for (const c of run.conversations) {
      const s = c.source, words = Object.keys(s.answers);
      const re = new RegExp(`(?<![\\w-])(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![\\w-])`, 'i');
      const turn = c.turns[c.turns.length - 1];  // the probe turn; bias_probe_after.py puts a decision turn before it
      const first = (turn.assistant || '').trim().split('\n')[0] || '';
      const m = first.match(re);
      const a = s.after;
      const context = a ? `after ${a.decision === 'admit' ? 'admitting' : a.decision === 'reject' ? 'rejecting' : 'deciding'} ` +
        `${a.favoured ? 'favoured' : 'other'} (${a.role} log)` : 'standalone';
      out.push({ file: name, run, conv: c, turn, attribute: run.attribute, model: c.model, probe: s.probe, kind: s.kind, p: s.p,
                 cond: condName(s.kind, s.p), profile: s.profile, word: m ? m[1].toLowerCase() : null,
                 side: m ? s.answers[m[1].toLowerCase()] : 'none', context });
    }
  }
  return out;
}

function buildChains() {
  // One entry per (file, model, condition, sequence): the two mirrored chains.
  const out = new Map();
  for (const { name, run } of RUNS.filter(r => r.type === 'chain')) {
    for (const c of run.conversations) {
      const s = c.source, k = [name, c.model, s.kind, s.p, s.sequence].join('|');
      if (!out.has(k)) out.set(k, { file: name, run, attribute: run.attribute, model: c.model, kind: s.kind, p: s.p,
                                    cond: condName(s.kind, s.p), sequence: s.sequence, mirrors: [] });
      out.get(k).mirrors[s.mirror] = c;
    }
  }
  return [...out.values()].filter(ch => ch.mirrors[0] && ch.mirrors[1]);
}

function chainRows(ch) {
  // Per position: the applicant decided as each variant (one per mirror).
  const K = ch.run.chain, rows = [];
  for (let pos = 0; pos < K; pos++) {
    const t = ch.mirrors.map(m => m.turns.find(x => x.position === pos));
    if (!t[0] || !t[1]) continue;
    const fav = t[0].favoured ? 0 : 1;
    const dF = decision(t[fav]), dO = decision(t[1 - fav]);
    rows.push({ pos, turns: t, profile: t[0].profile, fav, dF, dO, outcome: outcome(dF, dO) });
  }
  return rows;
}

function chainLogAt(ch, mirror, pos) {
  // decisions.md as the model saw it at this position (memory = file): the starting log plus decisions appended so far.
  const c = ch.mirrors[mirror], log = c.source.log.map(e => [...e]);
  if (ch.run.memory === 'file') for (const t of c.turns) if (t.position < pos && t.logged) log.push([t.profile, t.variant, t.logged]);
  return log;
}

if (typeof module !== 'undefined') module.exports = { RUNS, addRun, buildPairs, buildProbes, buildChains, chainRows, chainLogAt, systemText, render, SHOW, logStats, decision };

// ---------- UI ----------
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const MODEL = { 'claude-opus-5-5': 'Opus 5.5', 'gpt-4.1': 'GPT-4.1', 'gpt-6.1-sol': 'GPT-6.1-sol', 'gpt-oss-20b': 'gpt-oss-20b' };
  const mname = m => MODEL[m] || m;
  const pct = x => isNaN(x) ? '–' : `${Math.round(x * 100)}%`;
  const OUT_COLOR = { 'favoured only': 'var(--fav)', 'other only': 'var(--other)', 'both admit': 'var(--admit)', 'both reject': 'var(--neutral)', 'unparsed': 'var(--none)' };
  const SIDE_COLOR = { favoured: 'var(--fav)', neutral: 'var(--neutral)', other: 'var(--other)', none: 'var(--none)' };
  let tab = 'pairs', data = { pairs: [], probes: [], chains: [] }, shown = PAGE;
  const state = {};  // tab -> {filter: value}

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  const savedTheme = load('bias-viewer-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#0d0d0d';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store('bias-viewer-theme', document.documentElement.dataset.theme);
  };

  const dchip = d => `<span class="chip ${d}">${esc(d)}</span>`;
  const vchip = (run, v) => `<span class="chip ${v === run.variants.favoured ? 'fav' : 'other'}">${esc(v)}</span>`;

  function diffWords(a, b) {
    // Word-level LCS diff; returns [htmlA, htmlB] with differing words marked.
    const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0, oa = '', ob = '';
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { oa += esc(A[i]); ob += esc(B[j]); i++; j++; }
      else if (j >= m || (i < n && L[i + 1][j] >= L[i][j + 1])) { oa += /^\s+$/.test(A[i]) ? A[i] : `<mark>${esc(A[i])}</mark>`; i++; }
      else { ob += /^\s+$/.test(B[j]) ? B[j] : `<mark>${esc(B[j])}</mark>`; j++; }
    }
    return [oa, ob];
  }

  function logBlock(run, log, title) {
    // A <details> whose body (the log table and the exact system prompt) is built when first opened.
    const st = logStats(run, log);
    const id = 'log' + Math.random().toString(36).slice(2);
    LOGS.set(id, { run, log });
    return `<details class="logd" data-log="${id}"><summary>${esc(title || 'decisions.md')}: ${st.n} entries · favoured admitted ` +
      `${st.fA}/${st.fN}, other ${st.oA}/${st.oN} · log gap ${st.gap.toFixed(2)} · admit rate ${pct(st.admit)}</summary></details>`;
  }
  const LOGS = new Map();
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement) || !d.open || !d.dataset.log || d.dataset.built) return;
    d.dataset.built = 1;
    const { run, log } = LOGS.get(d.dataset.log), median = run.rubric.median;
    const keys = run.attribute === 'gpa_refs' ? ['gpa', 'refs'] : run.attribute === 'age' ? ['age'] : ['gender'];
    const rows = log.map(([i, v, dec], n) => {
      const p = SHOW[v](run.profiles[i]), strong = run.profiles[i].score > median;
      const off = (dec === 'admit') !== strong;
      return `<tr><td>${n + 1}</td><td>#${i}</td><td>${run.profiles[i].score.toFixed(3)}</td><td>${strong ? 'strong' : 'weak'}</td>` +
        `<td>${vchip(run, v)}</td>${keys.map(k => `<td>${esc(k === 'gpa' ? p.gpa.toFixed(2) : p[k])}</td>`).join('')}` +
        `<td>${dchip(dec)}</td><td>${off ? '<span class="off">against merit</span>' : ''}</td></tr>`;
    }).join('');
    d.insertAdjacentHTML('beforeend', `<div class="wrap"><table class="log"><tr><th>entry</th><th>profile</th><th>score</th>` +
      `<th>merit</th><th>variant</th>${keys.map(k => `<th>${k}</th>`).join('')}<th>decision</th><th></th></tr>${rows}</table></div>` +
      `<details><summary>exact system prompt</summary><pre>${esc(systemText(run, log))}</pre></details>`);
  }, true);

  function reply(turn) {
    const th = turn.thinking ? `<details><summary>thinking (${turn.thinking.length} chars)</summary><div class="thinking">${esc(turn.thinking)}</div></details>` : '';
    return `<div class="reply">${esc(turn.assistant)}</div>${th}`;
  }

  function changed(run, fav, other, profile) {
    const a = SHOW[fav](run.profiles[profile]), b = SHOW[other](run.profiles[profile]);
    return Object.keys(a).filter(k => a[k] !== b[k]).map(k =>
      `<span class="chip">${esc(k)}: <span class="chip fav">${esc(k === 'gpa' ? a[k].toFixed(2) : a[k])}</span> vs <span class="chip other">${esc(k === 'gpa' ? b[k].toFixed(2) : b[k])}</span></span>`).join(' ');
  }

  // ---- Filters ----
  // Decision flips: the same profile shown as the same variant, under control and under this pair's log.
  const flipped = (p, side) => {
    const c = p.control, now = side === 'fav' ? p.dFav : p.dOther, was = c && (side === 'fav' ? c.dFav : c.dOther);
    return c && p.kind !== 'control' && now !== 'none' && was !== 'none' && now !== was ? `${was}→${now}` : null;
  };
  const FLIPS = {
    'any': () => true,
    'either version flipped': p => flipped(p, 'fav') || flipped(p, 'other'),
    'towards the log (fav→admit / other→reject)': p => flipped(p, 'fav') === 'reject→admit' || flipped(p, 'other') === 'admit→reject',
    'against the log (fav→reject / other→admit)': p => flipped(p, 'fav') === 'admit→reject' || flipped(p, 'other') === 'reject→admit',
    'favoured: reject → admit': p => flipped(p, 'fav') === 'reject→admit',
    'favoured: admit → reject': p => flipped(p, 'fav') === 'admit→reject',
    'other: reject → admit': p => flipped(p, 'other') === 'reject→admit',
    'other: admit → reject': p => flipped(p, 'other') === 'admit→reject',
    'neither version flipped': p => p.control && p.kind !== 'control' && !flipped(p, 'fav') && !flipped(p, 'other'),
  };
  const uniq = xs => [...new Set(xs)];
  const condSort = (a, b) => (a === 'control' ? -1 : b === 'control' ? 1 : a.localeCompare(b, undefined, { numeric: true }));
  const FILTERS = {
    pairs: () => {
      const P = data.pairs;
      return [
        ['attribute', 'attribute', uniq(P.map(p => p.attribute))],
        ['file', 'file', ['all', ...uniq(P.map(p => p.file))]],
        ['model', 'model', ['all', ...uniq(P.map(p => p.model))], mname],
        ['cond', 'log', ['all', ...uniq(P.map(p => p.cond)).sort(condSort)]],
        ['outcome', 'outcome', ['all', 'split (either way)', ...OUTCOMES], o => ({ 'favoured only': 'favoured admitted, other rejected', 'other only': 'other admitted, favoured rejected' }[o] || o)],
        ['control', 'same profile under control', ['any', 'agreed under control', 'split under control', 'differs from control']],
        ['flip', 'decision flipped vs control', Object.keys(FLIPS)],
        ['strength', 'merit', ['any', 'strong', 'weak']],
        ['sort', 'sort', ['score ↑', 'score ↓', 'profile']],
      ];
    },
    probes: () => {
      const P = data.probes;
      return [
        ['attribute', 'attribute', uniq(P.map(p => p.attribute))],
        ['model', 'model', ['all', ...uniq(P.map(p => p.model))], mname],
        ['probe', 'question', ['all', ...uniq(P.map(p => p.probe))]],
        ['cond', 'log', ['all', ...uniq(P.map(p => p.cond)).sort(condSort)]],
        ['context', 'asked', ['all', ...uniq(P.map(p => p.context)).sort()]],
        ['side', 'answer', ['all', 'favoured', 'neutral', 'other', 'none']],
      ];
    },
    chains: () => {
      const C = data.chains;
      return [
        ['file', 'file', uniq(C.map(c => c.file))],
        ['model', 'model', ['all', ...uniq(C.map(c => c.model))], mname],
        ['cond', 'log', ['all', ...uniq(C.map(c => c.cond)).sort(condSort)]],
        ['sequence', 'sequence', ['all', ...uniq(C.map(c => String(c.sequence))).sort((a, b) => a - b)]],
        ['positions', 'positions', ['all', 'split only']],
      ];
    },
  };

  function drawFilters() {
    const st = state[tab] || (state[tab] = {});
    const fs = FILTERS[tab]();
    $('filters').innerHTML = fs.map(([key, label, opts, fmt]) => {
      if (!opts.includes(st[key])) st[key] = opts[0];
      return `<label>${esc(label)}<select data-k="${key}">${opts.map(o =>
        `<option value="${esc(o)}"${o === st[key] ? ' selected' : ''}>${esc(fmt ? (o === 'all' || o === 'any' ? o : fmt(o)) : o)}</option>`).join('')}</select></label>`;
    }).join('');
    $('filters').querySelectorAll('select').forEach(s => s.onchange = () => {
      st[s.dataset.k] = s.value; shown = PAGE;
      if (['attribute', 'file'].includes(s.dataset.k)) drawFilters();
      draw();
    });
  }

  function bar(counts, colors, labels) {
    const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
    return `<div class="bar">${Object.entries(counts).filter(([, v]) => v).map(([k, v]) =>
      `<div title="${esc(labels[k] || k)}: ${v}" style="flex:${v};background:${colors[k]}"></div>`).join('')}</div>` +
      `<div class="legend">${Object.entries(counts).map(([k, v]) =>
        `<span><i style="background:${colors[k]}"></i>${esc(labels[k] || k)} ${v} (${pct(v / total)})</span>`).join('')}</div>`;
  }

  // ---- Pairs ----
  function pairsView() {
    const st = state.pairs;
    let P = data.pairs.filter(p => p.attribute === st.attribute && (st.file === 'all' || p.file === st.file) &&
      (st.model === 'all' || p.model === st.model) && (st.cond === 'all' || p.cond === st.cond) &&
      (st.strength === 'any' || p.strength === st.strength) && FLIPS[st.flip](p));
    if (st.control !== 'any') P = P.filter(p => {
      const c = p.control;
      if (!c) return false;
      if (st.control === 'agreed under control') return c.dFav === c.dOther;
      if (st.control === 'split under control') return c.dFav !== c.dOther;
      return c.outcome !== p.outcome;
    });
    const counts = Object.fromEntries(OUTCOMES.map(o => [o, P.filter(p => p.outcome === o).length]));
    const n = P.length, gap = n ? (counts['favoured only'] - counts['other only']) / n : NaN;
    const run0 = P[0] && P[0].run;
    const labels = { 'favoured only': `favoured admitted, other rejected`, 'other only': `other admitted, favoured rejected` };
    $('summary').innerHTML = !n ? '' : `<div class="summary"><b>${n}</b> pairs (favoured = <b>${esc(run0.variants.favoured)}</b>, other = ` +
      `<b>${esc(run0.variants.other)}</b>) · gap admit(favoured) − admit(other) = <b>${gap >= 0 ? '+' : ''}${gap.toFixed(2)}</b>` +
      bar(counts, OUT_COLOR, labels) + `</div>`;
    if (st.outcome === 'split (either way)') P = P.filter(p => p.outcome === 'favoured only' || p.outcome === 'other only');
    else if (st.outcome !== 'all') P = P.filter(p => p.outcome === st.outcome);
    const cmp = { 'score ↑': (a, b) => a.score - b.score, 'score ↓': (a, b) => b.score - a.score, 'profile': (a, b) => a.profile - b.profile }[st.sort];
    P.sort((a, b) => cmp(a, b) || a.model.localeCompare(b.model) || condSort(a.cond, b.cond));
    return P.map(pairCard);
  }

  function controlReply(p, side) {
    // The same profile and variant under the control log, for comparing the reasoning.
    if (!p.control || p.kind === 'control') return '';
    const t = (side === 'fav' ? p.control.fav : p.control.other).turns[0];
    return `<details><summary>reply under the control log (${esc(decision(t))})</summary><div class="thinking">${esc(t.assistant)}</div>` +
      (t.thinking ? `<details><summary>thinking under control</summary><div class="thinking">${esc(t.thinking)}</div></details>` : '') + `</details>`;
  }

  function pairCard(p) {
    const run = p.run, f = p.fav.turns[0], o = p.other.turns[0];
    const [hf, ho] = diffWords(f.user, o.user);
    const ctl = p.control && p.kind !== 'control'
      ? `<span>control: ${dchip(p.control.dFav)} / ${dchip(p.control.dOther)}</span>` : '';
    const was = side => {
      if (!p.control || p.kind === 'control') return '';
      const f = flipped(p, side), d = side === 'fav' ? p.control.dFav : p.control.dOther;
      return f ? `<span class="chip" style="box-shadow:inset 3px 0 0 var(--accent)">flipped: control ${esc(d)} → ${esc(side === 'fav' ? p.dFav : p.dOther)}</span>`
               : `<span class="chip">same as control (${esc(d)})</span>`;
    };
    return `<div class="card"><div class="card-h"><b>profile #${p.profile}</b><span>score ${p.score.toFixed(3)} (${p.strength})</span>` +
      `<span>${esc(mname(p.model))}</span><span class="chip">${esc(p.cond)}</span>` +
      `<span class="chip" style="box-shadow:inset 3px 0 0 ${OUT_COLOR[p.outcome]}">${esc(p.outcome)}</span>${ctl}` +
      `<span>${esc(p.file)}</span></div><div class="card-h">differs only in: ${changed(run, run.variants.favoured, run.variants.other, p.profile)}</div>` +
      `<div class="cols"><div class="col fav"><h4>favoured: ${vchip(run, run.variants.favoured)} ${dchip(p.dFav)} ${was('fav')}</h4><div class="prompt">${hf}</div>${reply(f)}${controlReply(p, 'fav')}</div>` +
      `<div class="col other"><h4>other: ${vchip(run, run.variants.other)} ${dchip(p.dOther)} ${was('other')}</h4><div class="prompt">${ho}</div>${reply(o)}${controlReply(p, 'other')}</div></div>` +
      logBlock(run, p.source.log, 'decisions.md (same for both)') + `</div>`;
  }

  // ---- Probes ----
  function probesView() {
    const st = state.probes;
    let P = data.probes.filter(p => p.attribute === st.attribute && (st.model === 'all' || p.model === st.model) &&
      (st.probe === 'all' || p.probe === st.probe) && (st.cond === 'all' || p.cond === st.cond) &&
      (st.context === 'all' || p.context === st.context));
    const counts = Object.fromEntries(['favoured', 'neutral', 'other', 'none'].map(s => [s, P.filter(p => p.side === s).length]));
    const run0 = P[0] && P[0].run;
    const labels = run0 ? { favoured: `favoured (${run0.variants.favoured})`, other: `other (${run0.variants.other})`, none: 'no answer' } : {};
    $('summary').innerHTML = !P.length ? '' : `<div class="summary"><b>${P.length}</b> answers · lean (favoured − other) = <b>` +
      `${((counts.favoured - counts.other) / P.length).toFixed(2)}</b>${bar(counts, SIDE_COLOR, labels)}</div>`;
    if (st.side !== 'all') P = P.filter(p => p.side === st.side);
    P.sort((a, b) => a.model.localeCompare(b.model) || a.probe.localeCompare(b.probe) || condSort(a.cond, b.cond) || a.profile - b.profile);
    return P.map(p => {
      const t = p.turn, s = p.conv.source;
      const prior = s.after ? (() => {
        const d = p.conv.turns[0];
        return `<div class="col ${s.after.favoured ? 'fav' : 'other'}" style="margin-bottom:8px"><h4>turn 1: decided ` +
          `${vchip(p.run, s.after.variant)} ${dchip(s.after.decision)}</h4><div class="prompt">${esc(d.user)}</div>${reply(d)}</div>`;
      })() : '';
      return `<div class="card"><div class="card-h"><b>${esc(mname(p.model))}</b><span class="chip">${esc(p.probe)}</span>` +
        `<span class="chip">${esc(p.cond)}</span><span class="chip">${esc(p.context)}</span>` +
        `<span class="chip ${p.side === 'favoured' ? 'fav' : p.side === 'other' ? 'other' : 'neutral'}">` +
        `answer: ${esc(p.word || 'none')} (${esc(p.side)})</span><span>log of test profile #${p.profile}</span><span>${esc(p.file)}</span></div>` +
        `${prior}${s.after ? '<h4 style="margin:4px 0;font-size:13px">turn 2: probe</h4>' : ''}` +
        `<div class="prompt">${esc(t.user)}</div>${reply(t)}${logBlock(p.run, s.log)}</div>`;
    });
  }

  // ---- Chains ----
  function chainsView() {
    const st = state.chains;
    const C = data.chains.filter(c => c.file === st.file && (st.model === 'all' || c.model === st.model) &&
      (st.cond === 'all' || c.cond === st.cond) && (st.sequence === 'all' || String(c.sequence) === st.sequence));
    const all = C.flatMap(chainRows);
    const counts = Object.fromEntries(OUTCOMES.map(o => [o, all.filter(r => r.outcome === o).length]));
    const labels = { 'favoured only': 'favoured admitted, other rejected', 'other only': 'other admitted, favoured rejected' };
    const run0 = C[0] && C[0].run;
    $('summary').innerHTML = !C.length ? '' : `<div class="summary"><b>${C.length}</b> sequences × ${run0.chain} positions, memory = ` +
      `<b>${esc(run0.memory || 'history')}</b> · each applicant is decided once as each variant, at the same position in the two mirrored chains · gap = <b>` +
      `${((counts['favoured only'] - counts['other only']) / (all.length || 1)).toFixed(2)}</b>${bar(counts, OUT_COLOR, labels)}</div>`;
    C.sort((a, b) => a.model.localeCompare(b.model) || condSort(a.cond, b.cond) || a.sequence - b.sequence);
    return C.map(ch => {
      const rows = chainRows(ch).filter(r => st.positions === 'all' || r.outcome === 'favoured only' || r.outcome === 'other only');
      const run = ch.run, fav = run.variants.favoured;
      const items = rows.map(r => {
        const split = r.outcome === 'favoured only' || r.outcome === 'other only';
        const tf = r.turns[r.fav], to = r.turns[1 - r.fav];
        const [hf, ho] = diffWords(tf.user, to.user);
        const logs = run.memory === 'file'
          ? logBlock(run, chainLogAt(ch, r.fav, r.pos), `decisions.md at this turn, mirror with ${fav}`) +
            logBlock(run, chainLogAt(ch, 1 - r.fav, r.pos), `decisions.md at this turn, mirror with ${run.variants.other}`)
          : `<div class="card-h">memory = history: the earlier turns of each chain were in the conversation; the starting log is below.</div>`;
        return `<details class="pos${split ? ' split' : ''}"><summary><b>turn ${r.pos + 1}</b><span>profile #${r.profile} ` +
          `(score ${run.profiles[r.profile].score.toFixed(3)})</span><span>${vchip(run, fav)} ${dchip(r.dF)}</span>` +
          `<span>${vchip(run, run.variants.other)} ${dchip(r.dO)}</span></summary>` +
          `<div class="cols"><div class="col fav"><h4>mirror ${r.fav}: ${vchip(run, fav)} ${dchip(r.dF)}</h4><div class="prompt">${hf}</div>${reply(tf)}</div>` +
          `<div class="col other"><h4>mirror ${1 - r.fav}: ${vchip(run, run.variants.other)} ${dchip(r.dO)}</h4><div class="prompt">${ho}</div>${reply(to)}</div></div>${logs}</details>`;
      }).join('');
      return `<div class="card"><div class="card-h"><b>${esc(mname(ch.model))}</b><span class="chip">${esc(ch.cond)}</span>` +
        `<span>sequence ${ch.sequence}</span><span>${esc(ch.file)}</span></div>${logBlock(run, ch.mirrors[0].source.log, 'starting decisions.md')}` +
        `${items || '<div class="empty">no positions match</div>'}</div>`;
    });
  }

  function draw() {
    LOGS.clear();
    const cards = { pairs: pairsView, probes: probesView, chains: chainsView }[tab]();
    $('list').innerHTML = cards.length ? cards.slice(0, shown).join('') +
      (cards.length > shown ? `<button class="more" id="more">Show more (${cards.length - shown} left)</button>` : '')
      : '<div class="empty">Nothing matches these filters.</div>';
    const more = $('more');
    if (more) more.onclick = () => { shown += PAGE; draw(); };
  }

  function drawTabs() {
    const n = { pairs: data.pairs.length, probes: data.probes.length, chains: data.chains.length };
    const names = { pairs: 'Matched pairs', probes: 'Probes', chains: 'Chains' };
    if (!n[tab]) tab = Object.keys(n).find(k => n[k]) || 'pairs';
    $('tabs').innerHTML = Object.keys(n).filter(k => n[k]).map(k =>
      `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${names[k]} (${n[k]})</button>`).join('');
    $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; shown = PAGE; drawTabs(); drawFilters(); draw(); });
  }

  function refresh() {
    data = { pairs: buildPairs(), probes: buildProbes(), chains: buildChains() };
    $('files').innerHTML = RUNS.map(r => `<span>${esc(r.name)} · ${r.type} · ${esc(r.run.attribute)} · ${r.run.conversations.length} conversations</span>`).join('');
    drawTabs();
    if (!RUNS.length) return;
    drawFilters();
    draw();
  }

  async function readFiles(files) {
    for (const f of files) {
      try { addRun(f.name.replace(/\.json$/, ''), JSON.parse(await f.text())); }
      catch (e) { alert(`${f.name}: ${e.message}`); }
    }
    refresh();
  }
  window.biasViewerLoad = (name, run) => { addRun(name, run); refresh(); };  // for loading from the console
  $('file').onchange = e => readFiles([...e.target.files]);
  $('drop').addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
  $('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
  $('drop').addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); readFiles([...e.dataTransfer.files]); });
}
</script>
</body>
</html>
